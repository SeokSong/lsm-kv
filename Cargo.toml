# workspace: the database and the race data library on top of it (md/OVERVIEW.md)
#   crates/lsm-kv    the store: WAL, memtables, SSTables, manifest, merge, bulk load
#   crates/racedata  sources (.ibt, OpenF1), laps and sectors, column chunks, keys, import
[workspace]
members = ["crates/lsm-kv", "crates/racedata"]
# a virtual workspace has no edition to infer the resolver from, so it's set here
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# versions live here once. each crate still lists only what it uses ({ workspace = true })
[workspace.dependencies]
lsm-kv = { path = "crates/lsm-kv" }
crc32fast = "1.5.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# dev
crc32c = "0.6.9"
criterion = "0.8.2"
tempfile = "3.27.0"
