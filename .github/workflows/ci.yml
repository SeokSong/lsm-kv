name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # linux is the target platform, macos is the dev machine
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --check

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # make sure benchmarks still compile, without running them
      - name: build benchmarks
        run: cargo bench --no-run
